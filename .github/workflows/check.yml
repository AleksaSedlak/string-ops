name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get install -y -q jq tmux >/dev/null && git config --global user.email ci@example.com && git config --global user.name ci
      - name: Fast suite
        run: bash tests/check.sh

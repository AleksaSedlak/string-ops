# Workspace settings. Written by /start, read by every script. Plain KEY=value, no quoting needed.

# Branches nobody commits to or pushes to directly. Work happens on a branch per workstream and reaches
# these only through a pull request.
PROTECTED_BRANCHES=main master staging develop

# Most workers allowed to be working at the same time.
WORKER_CAP=10

# Most verified learnings kept per repo; the oldest makes room.
LEARNINGS_CAP=15

# Model and reasoning effort per role: planning (this session), change workers, read-only lookup
# workers, and the independent reviewers integrate starts (read-only, but judgement work).
# A model is a Claude Code alias or model id. "default" is the model Claude Code starts with on this
# machine, which is the latest model unless you pinned another one; set a value only to pin one role.
MODEL_PLAN=default
MODEL_CODE=default
MODEL_LOOKUP=default
MODEL_REVIEW=default
EFFORT_PLAN=xhigh
EFFORT_CODE=high
EFFORT_LOOKUP=medium
EFFORT_REVIEW=high

# How workers answer Claude Code's permission prompts. auto (the default): a built-in classifier answers
# routine prompts so workers do the work instead of asking; acceptEdits: file edits go through, shell
# commands still ask; default: every prompt waits for a person (a worker then blocks until someone
# answers through the coordinator). Whatever the mode, the guard hook and the deny list still hard-block
# pushing, merging, publishing, deploy tooling and credential reads.
WORKER_PERMISSION_MODE=auto

# Where change workers run: herdr, tmux, or auto (herdr when installed, otherwise tmux).
WORKER_BACKEND=auto
# Where read-only workers (lookups, reviews) run: headless (a background claude -p process, no window,
# nothing to boot or watch, the fastest answer) or window (the same window backend as change workers,
# for when you want to watch them). One lookup can be forced into a window with --window.
LOOKUP_BACKEND=headless
# With tmux, every worker is a window in this session; watch them with: tmux attach -t workers
TMUX_SESSION=workers
